# Local roadmap-tutor stack. Every published port binds to 127.0.0.1 only.
#   docker compose up -d --wait                          api + postgres + qdrant + searxng + playwright-mcp
#   docker compose --profile observability up -d --wait  adds Phoenix at http://127.0.0.1:6006
# SEARXNG_SECRET must be set (export it or put it in a root .env); compose refuses to start without it.
# See docs/platform/running-locally.md.
name: roadmap-tutor

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: roadmap-tutor-api:local
    env_file:
      - path: backend/.env
        required: false
    # `environment` overrides anything of the same name in backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://tutor:tutor@postgres:5432/tutor
      PLATFORM_QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://phoenix:6006/v1/traces
      SKIP_DOTENV: "1"
      # pinned so a HOST/PORT/WEB_DIST in backend/.env cannot break the port mapping or the SPA path
      HOST: 0.0.0.0
      PORT: "8000"
      WEB_DIST: /app/web/dist
      SEARXNG_URL: http://searxng:8080
      PLAYWRIGHT_MCP_URL: http://playwright-mcp:8931/mcp
    ports:
      - "127.0.0.1:8000:8000"
    # `default` reaches postgres, qdrant, searxng and phoenix; `browser` reaches only playwright-mcp
    networks:
      - default
      - browser
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.2
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.11.6-ac11e14c5
    # The secret is read from the environment, never from the mounted settings file. Generate one with
    #   export SEARXNG_SECRET=$(openssl rand -hex 32)      (or put SEARXNG_SECRET=... in a root .env)
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET (e.g. export SEARXNG_SECRET=$(openssl rand -hex 32))}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8888:8080"
    restart: unless-stopped

  playwright-mcp:
    # Playwright MCP (headless Chromium) over streamable HTTP at /mcp. It sits alone on the `browser` network, so
    # it cannot resolve postgres, qdrant, searxng or phoenix; the API joins `browser` to reach it.
    # Flags checked against `docker run --rm mcr.microsoft.com/playwright/mcp:v0.0.86 --help`:
    #   --allowed-hosts <hosts...>   comma-separated Host header values the server accepts. It replaces the default
    #                                (localhost/loopback) and compares host:port exactly, so the API's
    #                                `playwright-mcp:8931` and the host-side `127.0.0.1:8931` / `localhost:8931`
    #                                are all listed.
    #   --blocked-origins <origins>  semicolon-separated origins the browser may not request. Playwright says this
    #                                is not a security boundary (redirects are not covered): the gateway's URL
    #                                policy on every reported `Page URL:` is the real check.
    # The image's entrypoint already passes --headless --browser chromium --no-sandbox; they are repeated here
    # so the whole command line is visible.
    image: mcr.microsoft.com/playwright/mcp:v0.0.86
    command:
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --isolated
      - --host
      - 0.0.0.0
      - --port
      - "8931"
      - --allowed-hosts
      - playwright-mcp:8931,127.0.0.1:8931,localhost:8931
      - --blocked-origins
      - http://api:8000;http://host.docker.internal;http://localhost;http://127.0.0.1
    networks:
      - browser
    ports:
      - "127.0.0.1:8931:8931"
    # A TCP connect to the MCP port (node is in the image); `up --wait` waits for it.
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8931, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-21.2.1
    profiles: ["observability"]
    # Phoenix 21 turns auth on for a non-loopback bind (0.0.0.0 inside the container), which would reject
    # the API's unauthenticated OTLP export. The host port is loopback-only, so run it as a local dev tool.
    environment:
      PHOENIX_ENABLE_AUTH: "false"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_DISABLE_AGENT_ASSISTANT: "true"
    ports:
      - "127.0.0.1:6006:6006"
    restart: unless-stopped

networks:
  browser:

volumes:
  pgdata:
  qdrant_data:

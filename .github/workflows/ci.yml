name: CI

on:
  push:
    branches: [main, hf-deploy, rag-upgrade, roadmap-tutor]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch keeps the install small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest
      - name: "Unit tests (offline: no LLM, no Qdrant)"
        run: python -m pytest backend/tests -q

  retrieval-quality-gate:
    # Free: retrieval eval makes no LLM calls. Needs QDRANT_URL / QDRANT_API_KEY repo secrets.
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when secrets are unavailable (e.g. PRs from forks)
        id: check
        run: echo "enabled=${{ env.QDRANT_URL != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.check.outputs.enabled == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Retrieval eval on the held-out test split (fail if hit@5 < 0.85)
        if: steps.check.outputs.enabled == 'true'
        run: python -m backend.eval.retrieval_eval --split test --configs v2_hybrid v2_dense --min-hit5 0.85 --no-save

  platform-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQUIRE_DB: "1"
      DATABASE_URL: postgresql+psycopg://tutor:tutor@localhost:5432/postgres
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-platform.txt
      - name: Install (CPU-only torch first, then the platform requirements)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-platform.txt pytest
      - name: "Platform tests (Postgres required: DB tests fail instead of skipping)"
        run: python -m pytest backend/tests backend/tutor/tests -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHON: python
      E2E_PG_URL: postgresql+psycopg://tutor:tutor@localhost:5432
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-platform.txt
      - name: Install (CPU-only torch first, then the platform requirements)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-platform.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: "End-to-end tests (Playwright starts the API servers)"
        working-directory: web
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Generate a SearXNG secret for compose (it has no default)
        run: echo "SEARXNG_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Bring the stack up and wait for healthy
        run: docker compose up -d --build --wait
      - name: Health check
        run: curl -fsS http://127.0.0.1:8000/api/health
      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: "Multi-arch image build (amd64 + arm64, not pushed)"
        run: docker buildx build --platform linux/amd64,linux/arm64 -f docker/api.Dockerfile --output type=cacheonly .
